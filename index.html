          "name": "How do you determine if a line and circle are secant, tangent, or disjoint?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Calculate the perpendicular distance d from the circle's center (x₀, y₀) to the line Ax + By + C = 0 using d = |Ax₀ + By₀ + C| / √(A² + B²). Compare d to radius R: if d < R, they are secant (2 intersection points); if d = R, they are tangent (1 contact point); if d > R, they are disjoint (no intersections)."
          }
        },
        {
          "@type": "Question",
          "name": "What is the formula for the chord length intercepted by a secant line on a circle?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "By the perpendicular chord theorem, the radius R, center distance d, and half-chord L/2 form a right triangle: R² = d² + (L/2)². Solving for chord length gives L = 2√(R² - d²)."
          }
        },
        {
          "@type": "Question",
          "name": "How do you complete the square for a general circle equation x² + y² + Dx + Ey + F = 0?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Group x and y terms separately: (x² + Dx) + (y² + Ey) = -F. Add (D/2)² and (E/2)² to both sides to form perfect squares: (x + D/2)² + (y + E/2)² = (D² + E² - 4F) / 4. The center is (-D/2, -E/2) and the radius is R = √(D² + E² - 4F) / 2, provided D² + E² - 4F > 0."
          }
        }
      ]
    }
